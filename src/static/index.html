<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <details class="staff-menu">
        <summary aria-label="View staff profile">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M16 11a4 4 0 1 0-3.87-5h1.74A2.25 2.25 0 1 1 16 8.5v1.75c3.38 0 6 1.77 6 4v1.25h-4v-1.25c0-1.05-.73-2.14-2-2.92V11ZM8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 1.75c-3.38 0-6 1.77-6 4V20h12v-2.25c0-2.23-2.62-4-6-4Z" />
          </svg>
        </summary>
        <div class="staff-profile-menu">
          <h3>Employee Profile</h3>
          <dl>
            <div><dt>First name</dt><dd>Jordan</dd></div>
            <div><dt>Last name</dt><dd>Lee</dd></div>
            <div><dt>Email</dt><dd>jordan.lee@mergington.edu</dd></div>
            <div><dt>Employee category</dt><dd>Faculty</dd></div>
          </dl>
        </div>
      </details>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
