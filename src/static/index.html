<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>

      <div class="profile-menu" id="profile-menu">
        <button
          type="button"
          class="profile-icon-button"
          id="profile-icon-button"
          aria-haspopup="true"
          aria-expanded="false"
          aria-label="View staff profile"
        >
          &#128100;
        </button>
        <div class="profile-card" id="profile-card">
          <h4>Staff Profile</h4>
          <p><strong>Name:</strong> <span id="profile-name">Loading...</span></p>
          <p><strong>Email:</strong> <span id="profile-email">Loading...</span></p>
          <p><strong>Category:</strong> <span id="profile-category">Loading...</span></p>
        </div>
      </div>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
